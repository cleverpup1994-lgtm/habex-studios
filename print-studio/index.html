<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Studio: Lithophane &amp; Keychain Maker (demo)</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b5; --accent:#ff8a3d; --accent2:#ffb37a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .app { display:grid; grid-template-columns:340px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:18px 18px 28px; }
  h1 { font-size:20px; margin:0 0 2px; }
  .tag { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:16px; }
  .tabs button { padding:10px 6px; border-radius:10px; border:1px solid var(--line); background:#11141a; color:var(--text); font-weight:600; cursor:pointer; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#1a1006; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  .val { float:right; color:var(--text); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=text], select { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#11141a; color:var(--text); font-size:15px; }
  .file { display:block; padding:12px; border:1.5px dashed var(--line); border-radius:10px; text-align:center; cursor:pointer; color:var(--muted); }
  .file:hover { border-color:var(--accent); color:var(--text); }
  .file input { display:none; }
  canvas#crop { width:100%; border-radius:8px; margin-top:10px; background:#000; display:block; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .chk { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--text); font-size:14px; }
  .btn { display:block; width:100%; margin-top:18px; padding:13px; border:0; border-radius:12px; background:var(--accent); color:#1a1006; font-weight:800; font-size:16px; cursor:pointer; }
  .btn:hover { background:var(--accent2); }
  .stats { margin-top:10px; font-size:12.5px; color:var(--muted); }
  main { position:relative; }
  #view { width:100%; height:100%; display:block; }
  .hud { position:absolute; left:16px; top:14px; display:flex; gap:8px; }
  .hud button { padding:8px 12px; border-radius:9px; border:1px solid var(--line); background:rgba(24,27,34,.9); color:var(--text); cursor:pointer; font-weight:600; }
  .hud button.on { border-color:var(--accent); color:var(--accent); }
  .foot { position:absolute; right:16px; bottom:12px; font-size:12px; color:var(--muted); background:rgba(15,17,21,.75); padding:6px 10px; border-radius:8px; }
  .hidden { display:none; }
  @media (max-width:820px) { .app { grid-template-columns:1fr; grid-template-rows:auto 60vh; height:auto; } main { height:60vh; } aside { border-right:0; border-bottom:1px solid var(--line); } }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<div class="app">
  <aside>
    <h1>Print Studio</h1>
    <div class="tag">Photo → lithophane, or name → keychain. Preview in 3D, download an STL for Bambu Studio or any slicer.</div>

    <div class="tabs">
      <button id="tabLitho" class="on">Lithophane</button>
      <button id="tabKey">Name keychain</button>
    </div>

    <section id="paneLitho">
      <label class="file">📷 Upload a photo<input type="file" id="photo" accept="image/*"></label>
      <canvas id="crop" width="300" height="225"></canvas>
      <label>Shape</label>
      <select id="ratio">
        <option value="1.3333">Landscape 4:3</option>
        <option value="1">Square 1:1</option>
        <option value="0.75">Portrait 3:4</option>
      </select>
      <label>Zoom <span class="val" id="zoomV"></span></label>
      <input type="range" id="zoom" min="1" max="3" step="0.05" value="1">
      <div class="row">
        <div><label>Move left/right</label><input type="range" id="offX" min="-1" max="1" step="0.02" value="0"></div>
        <div><label>Move up/down</label><input type="range" id="offY" min="-1" max="1" step="0.02" value="0"></div>
      </div>
      <label>Width <span class="val" id="widthV"></span></label>
      <input type="range" id="width" min="50" max="200" step="5" value="100">
      <div class="row">
        <div><label>Thinnest (mm) <span class="val" id="minTV"></span></label><input type="range" id="minT" min="0.6" max="1.5" step="0.1" value="0.8"></div>
        <div><label>Thickest (mm) <span class="val" id="maxTV"></span></label><input type="range" id="maxT" min="2" max="5" step="0.1" value="3"></div>
      </div>
      <label>Detail <span class="val" id="resV"></span></label>
      <input type="range" id="res" min="0.25" max="0.8" step="0.05" value="0.4">
      <div class="chk"><input type="checkbox" id="frame" checked> Add a 3 mm frame</div>
    </section>

    <section id="paneKey" class="hidden">
      <label>Name</label>
      <input type="text" id="name" value="ABEL" maxlength="14">
      <label>Letter height <span class="val" id="txtHV"></span></label>
      <input type="range" id="txtH" min="8" max="20" step="1" value="12">
      <div class="row">
        <div><label>Base (mm) <span class="val" id="baseTV"></span></label><input type="range" id="baseT" min="1.5" max="4" step="0.1" value="2.4"></div>
        <div><label>Letters (mm) <span class="val" id="raiseV"></span></label><input type="range" id="raise" min="0.8" max="3" step="0.1" value="1.6"></div>
      </div>
      <div class="chk"><input type="checkbox" id="loop" checked> Keyring hole</div>
    </section>

    <button class="btn" id="dl">⬇ Download STL</button>
    <div class="stats" id="stats"></div>
  </aside>

  <main>
    <canvas id="view"></canvas>
    <div class="hud">
      <button id="lit">💡 Backlit view</button>
      <button id="reset">⟲ Reset view</button>
    </div>
    <div class="foot">Demo by Abel Rios · Habex Studios · units in mm</div>
  </main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
